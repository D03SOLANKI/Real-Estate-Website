<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f3f3ec; }
      .grid { stroke: rgba(23, 35, 59, 0.05); stroke-width: 1; stroke-dasharray: 4,4; }
      .wall-thick { stroke: #17233b; stroke-width: 4; fill: #e5e5dc; }
      .wall-thin { stroke: #17233b; stroke-width: 2; fill: none; }
      .terrace-area { fill: #ebebe2; stroke: #b5cedb; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .window { stroke: #b5cedb; stroke-width: 3; fill: #ffffff; }
      .label-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #17233b; letter-spacing: 0.05em; text-transform: uppercase; }
      .label-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 500; fill: rgba(23, 35, 59, 0.6); }
      .dimension { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; fill: #340c24; font-weight: 600; }
      .furniture { stroke: rgba(23, 35, 59, 0.35); stroke-width: 1; fill: rgba(255, 255, 255, 0.6); }
    </style>
  </defs>

  <rect width="1000" height="700" class="bg" />

  <text x="60" y="45" class="label-title">Aurelia Residence — Type B: Ground Floor Garden Residence</text>
  <text x="60" y="65" class="label-sub">2 Bedrooms · 2 Bathrooms · Total Built: 105 m² + 29 m² Garden Terrace</text>

  <!-- Garden Terrace (Top) -->
  <rect x="60" y="90" width="880" height="130" class="terrace-area" />
  <text x="500" y="155" text-anchor="middle" class="label-title">Private Landscaped Garden &amp; Dining Terrace</text>
  <text x="500" y="175" text-anchor="middle" class="label-sub">29.0 m² · Seamless indoor-outdoor floor transitions</text>

  <!-- MAIN BOUNDARY -->
  <rect x="60" y="220" width="880" height="420" class="wall-thick" />

  <!-- Living Hall & Open Kitchen -->
  <rect x="65" y="225" width="500" height="410" fill="#fcfcf9" stroke="none" />
  <text x="315" y="340" text-anchor="middle" class="label-title">Open-Concept Living &amp; Lounge</text>
  <text x="315" y="360" text-anchor="middle" class="label-sub">38.0 m² · Uninterrupted garden panorama</text>
  
  <!-- Living room furniture -->
  <rect x="140" y="270" width="160" height="70" rx="6" class="furniture" />
  <rect x="180" y="300" width="80" height="30" rx="3" class="furniture" />

  <!-- Kitchen & Dining Area -->
  <line x1="65" y1="460" x2="565" y2="460" class="wall-thin" stroke-dasharray="8,6" />
  <text x="315" y="525" text-anchor="middle" class="label-title">Modern Kitchen &amp; Island</text>
  <text x="315" y="545" text-anchor="middle" class="label-sub">16.4 m² · Fully integrated stone worktops</text>
  <rect x="180" y="565" width="160" height="40" rx="3" class="furniture" />

  <!-- Central dividing wall -->
  <line x1="565" y1="220" x2="565" y2="640" class="wall-thick" />

  <!-- Master Suite (Right Top) -->
  <rect x="570" y="225" width="365" height="210" fill="#fcfcf9" stroke="none" />
  <text x="750" y="315" text-anchor="middle" class="label-title">Primary Master Suite</text>
  <text x="750" y="335" text-anchor="middle" class="label-sub">22.5 m² · Private en-suite with stone vanity</text>
  <rect x="700" y="250" width="100" height="85" rx="4" class="furniture" />

  <!-- Bedroom 2 (Right Bottom) -->
  <line x1="565" y1="435" x2="940" y2="435" class="wall-thin" />
  <rect x="570" y="440" width="365" height="195" fill="#fcfcf9" stroke="none" />
  <text x="750" y="525" text-anchor="middle" class="label-title">Guest Bedroom &amp; Bath</text>
  <text x="750" y="545" text-anchor="middle" class="label-sub">16.8 m² · Direct natural garden view</text>
  <rect x="710" y="465" width="85" height="70" rx="3" class="furniture" />

  <!-- Large Glass Sliders -->
  <rect x="120" y="216" width="380" height="8" class="window" />
  <rect x="620" y="216" width="260" height="8" class="window" />

  <!-- Compass -->
  <g transform="translate(900, 80)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#17233b" stroke-width="1.5" />
    <polygon points="0,-16 4,0 -4,0" fill="#340c24" />
    <polygon points="0,16 3,0 -3,0" fill="#17233b" opacity="0.4" />
    <text x="0" y="-19" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#17233b">N</text>
  </g>
</svg>
